name: Build & Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ainderew/workdash

# Queue runs instead of overlapping them. Every run deploys to the same droplet
# by pulling :latest, so two overlapping runs could let the older build go live
# if it finished last. A newer push replaces any run still waiting; a run that
# has started is never cancelled mid-deploy.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_SFU_SERVER_URL=${{ vars.NEXT_PUBLIC_SFU_SERVER_URL }}
            NEXT_PUBLIC_GIPHY_PICKER=${{ secrets.NEXT_PUBLIC_GIPHY_PICKER }}
            NEXT_PUBLIC_UMAMI_URL=${{ vars.NEXT_PUBLIC_UMAMI_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ainderew
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_PAT,GHCR_USER
          script: |
            set -e
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # The droplet's IPv6 route to ghcr.io sometimes resets mid-download
            # ("connection reset by peer"), so retry before failing the deploy.
            for attempt in 1 2 3 4; do
              docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest && break
              if [ "$attempt" -eq 4 ]; then
                echo "docker pull failed after 4 attempts" >&2
                exit 1
              fi
              echo "docker pull failed (attempt $attempt/4), retrying in $((attempt * 10))s" >&2
              sleep $((attempt * 10))
            done
            docker stop workdash-frontend || true
            docker rm workdash-frontend || true
            docker run -d \
              --name workdash-frontend \
              --network host \
              --restart unless-stopped \
              -e PORT=8080 \
              -e HOSTNAME=0.0.0.0 \
              -e NEXTAUTH_URL="${{ vars.NEXTAUTH_URL }}" \
              -e NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker image prune -f
