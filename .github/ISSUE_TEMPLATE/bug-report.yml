name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix it.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the app is affected?
      multiple: true
      options:
        - World Mode (2D game, avatar movement, proximity)
        - Desk Mode (chat UI, channels, threads)
        - Audio Chat
        - Video Chat
        - Screen Sharing
        - Authentication / Login
        - Character Customization
        - Polls
        - Soccer Mini-Game
        - File Uploads
        - UI / Styling
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Interaction Mode
      description: Which mode were you in when the bug occurred?
      options:
        - World Mode
        - Desk Mode
        - Both / Mode Switch
        - N/A
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what went wrong.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Recordings
      description: If applicable, add screenshots or screen recordings.

  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: Paste any relevant browser console or network errors.
      render: shell

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. macOS 15, Windows 11, Ubuntu 24.04
