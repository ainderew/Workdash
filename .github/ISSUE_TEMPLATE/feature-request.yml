name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Workdash? We'd love to hear it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app does this relate to?
      multiple: true
      options:
        - World Mode (2D game world)
        - Desk Mode (chat UI)
        - Audio / Video / Streaming
        - Screen Sharing
        - Character Customization
        - Mini-Games
        - Polls
        - Authentication
        - General UX
        - New Feature
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this solve, or what need does it address?
      placeholder: I find it frustrating when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you envision this working?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've thought of?

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / References
      description: Any sketches, screenshots, or links to similar features in other apps?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How big of a change do you think this is?
      options:
        - Small (UI tweak, minor addition)
        - Medium (new component or flow)
        - Large (new system or major rework)
        - Not sure
